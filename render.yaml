# One-click deploy on Render.com: New > Blueprint > pick this repository.
# Render asks for OPENAI_API_KEY, SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY during setup.
# With the Supabase values set, people sign in with their own username and password and see
# only their own jobs. APP_PASSWORD (one shared team password) is only used without Supabase.
services:
  - type: web
    name: plaque-proof-studio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    branch: claude/blissful-mccarthy-63trmd
    autoDeployTrigger: checksPass
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LEGACY_JOBS_OWNER
        value: taher
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_PLANNER_MODEL
        value: gpt-5.4
      - key: MOCK_AI
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: MAX_PARALLEL_IMAGES
        value: "2"
      - key: MAX_IMAGE_CALLS_PER_PROJECT
        value: "40"
      - key: DAILY_BUDGET_USD
        value: "40"
